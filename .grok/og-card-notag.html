<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("fonts/InstrumentSans-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("fonts/InstrumentSans-500.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #ffffff;
      }
      .studio {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        object-fit: cover;
        object-position: 78% 50%;
      }
      .lockup {
        position: absolute;
        left: 88px;
        top: 50%;
        transform: translateY(-50%);
        color: #232323;
        z-index: 2;
      }
      .wordmark {
        display: flex;
        align-items: baseline;
        font-family: "Instrument Sans", ui-sans-serif, sans-serif;
        font-size: 96px;
        letter-spacing: -0.035em;
        line-height: 1;
        white-space: nowrap;
      }
      .sparkle {
        height: 0.78em;
        width: auto;
        margin-right: 0.16em;
        transform: translateY(0.04em);
        flex-shrink: 0;
      }
      .future {
        font-weight: 500;
      }
      .self {
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="studio" src="og-base.jpg" alt="" />
      <div class="lockup">
        <div class="wordmark">

            aria-hidden="true"
          >

          <span class="future">future</span><span class="self">self</span>

      </div>
    </div>
  </body>
</html>
